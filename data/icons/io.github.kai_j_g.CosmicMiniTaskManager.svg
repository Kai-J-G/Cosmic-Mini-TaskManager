<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232b38" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>

    <!-- Display Bezel Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0e1520" />
    </linearGradient>

    <!-- Pulse Waveform Gradient -->
    <linearGradient id="pulseNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filter for Pulse Line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Main Card -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.8" filter="url(#dropShadow)" />

  <!-- Monitor / Oscilloscope Screen -->
  <rect x="18" y="18" width="92" height="56" rx="12" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Screen Grid Lines -->
  <line x1="18" y1="32" x2="110" y2="32" stroke="#1e293b" stroke-dasharray="2,3" stroke-width="1" />
  <line x1="18" y1="46" x2="110" y2="46" stroke="#1e293b" stroke-dasharray="2,3" stroke-width="1" />
  <line x1="18" y1="60" x2="110" y2="60" stroke="#1e293b" stroke-dasharray="2,3" stroke-width="1" />
  <line x1="41" y1="18" x2="41" y2="74" stroke="#1e293b" stroke-dasharray="2,3" stroke-width="1" />
  <line x1="64" y1="18" x2="64" y2="74" stroke="#1e293b" stroke-dasharray="2,3" stroke-width="1" />
  <line x1="87" y1="18" x2="87" y2="74" stroke="#1e293b" stroke-dasharray="2,3" stroke-width="1" />

  <!-- Activity Pulse Waveform -->
  <path d="M 20 46 L 36 46 L 43 28 L 52 64 L 61 36 L 70 52 L 78 46 L 94 46 L 99 38 L 103 46 L 108 46"
        fill="none" stroke="url(#pulseNeon)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Leading Apex Point -->
  <circle cx="61" cy="36" r="3.2" fill="#ffffff" />
  <circle cx="61" cy="36" r="1.6" fill="#38bdf8" />

  <!-- Task Manager Rows Below Screen -->
  <!-- Process Row 1: Running (Green) -->
  <rect x="18" y="83" width="70" height="9" rx="4.5" fill="#1e293b" />
  <rect x="18" y="83" width="46" height="9" rx="4.5" fill="#10b981" />
  <circle cx="23" cy="87.5" r="2.2" fill="#ffffff" />

  <!-- Running badge on row 1 -->
  <rect x="94" y="83" width="16" height="9" rx="4.5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <circle cx="102" cy="87.5" r="2" fill="#10b981" />

  <!-- Process Row 2: Stopped / Kill (Red) -->
  <rect x="18" y="98" width="70" height="9" rx="4.5" fill="#1e293b" />
  <rect x="18" y="98" width="62" height="9" rx="4.5" fill="#ef4444" />
  <circle cx="23" cy="102.5" r="2.2" fill="#ffffff" />

  <!-- "Kill" Action Button on row 2 -->
  <rect x="94" y="98" width="16" height="9" rx="4.5" fill="#ef4444" />
  <!-- Mini Kill Cross -->
  <path d="M 99.5 100.5 L 104.5 104.5 M 104.5 100.5 L 99.5 104.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
</svg>
